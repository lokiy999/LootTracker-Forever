<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoW Forever Crafting Profit</title>
<meta name="description" content="Crafting profit calculator for WoW Forever: cost per craft, break-even and profit after the 5% auction house cut.">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root { color-scheme: dark; --bg: #101318; --glow: #14243a; --panel: #171c23; --panel-2: #1e242d; --line: #2c3540;
    --text: #e8ebef; --muted: #98a2ae; --faint: #8792a0; --accent: #6db7ff; --gold: #e3b453; --good: #4ade80; --bad: #f87171;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--text);
    background: radial-gradient(1000px 420px at 50% -8%, var(--glow), transparent 70%), var(--bg);
    font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 60px; }
  header { text-align: center; padding: 34px 0 6px; }
  .crest { font-weight: 700; font-size: .78rem; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); }
  h1 { font: 700 clamp(2rem, 6vw, 3rem)/1.1 Cinzel, Georgia, serif; margin: 8px 0 6px; }
  h2 { font: 600 1rem Inter, sans-serif; margin: 22px 2px 8px; color: var(--muted); letter-spacing: .02em; }
  .sub { color: var(--faint); font-size: .85rem; margin: 0; }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 5px; margin: 20px 0 16px; }
  .tab { flex: 1 0 auto; border: 0; background: transparent; color: var(--muted); font: 500 .95rem Inter, sans-serif;
    padding: 9px 14px; border-radius: 8px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  .pad { padding: 14px 16px; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: .8rem; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.open { cursor: pointer; } tr.open:hover { background: var(--panel-2); }
  tr.open:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  tr.detail > td { background: var(--panel-2); padding: 14px 16px 18px; }
  tr.sec td { color: var(--muted); font-size: .74rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding-top: 14px; padding-bottom: 4px; }
  tr.last td { border-bottom: 0; }
  .inner { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; margin-top: 8px; }
  .inner td, .inner th { padding: 6px 10px; }
  .g { font-family: var(--mono); font-size: .86rem; }
  .pos { color: var(--good); } .neg { color: var(--bad); } .gold { color: var(--gold); }
  .small { color: var(--faint); font-size: .8rem; }
  .warn { color: var(--gold); font-size: .82rem; }
  .note { color: var(--muted); font-size: .85rem; margin: 12px 2px; }
  .empty { padding: 26px; text-align: center; color: var(--muted); }
  .chev { display: inline-block; width: 1em; color: var(--faint); transition: transform .15s; }
  tr.open[aria-expanded="true"] .chev { transform: rotate(90deg); }
  input, select, button { font: inherit; color: var(--text); }
  input[type=text], input[type=number], input[type=date], select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; font-size: .88rem; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input.gin { width: 112px; text-align: right; font-family: var(--mono); font-size: .84rem; }
  input.gin.bad { border-color: var(--bad); }
  input.qin { width: 64px; text-align: right; }
  button.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
    cursor: pointer; font-size: .88rem; }
  button.btn:hover { border-color: var(--accent); }
  button.primary { background: #1d3550; border-color: #2d5784; }
  button.link { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: .8rem; padding: 2px 4px; }
  button.link:hover { color: var(--bad); }
  .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .pill { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line);
    color: var(--muted); margin-left: 6px; vertical-align: 1px; }
  .pill.ah { color: var(--accent); } .pill.craft { color: var(--good); } .pill.vendor { color: var(--gold); }
  tr.be td { box-shadow: inset 0 1px 0 var(--gold); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  footer { color: var(--faint); font-size: .85rem; margin-top: 22px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crest">WoW Forever · EU Normal · Horde</div>
    <h1>Crafting Profit</h1>
    <p class="sub">Cost per craft, break-even and profit after the 5% auction house cut. Everything is saved in this browser only.</p>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="calc">Calculator</button>
    <button class="tab" role="tab" data-tab="prices">Prices</button>
    <button class="tab" role="tab" data-tab="batches">Batches</button>
  </nav>
  <p class="warn" id="stale" hidden></p>
  <main id="view"></main>
  <footer>Prices move within hours: update them from a fresh AH scan before you craft.
    Not affiliated with Blizzard. <a href="/">Loot site</a></footer>
</div>
<script>
"use strict";
const KEY = "forever-craft-v1";
const CUT = 0.95;
const DEFAULT_AT = "2026-11-22T09:00:00Z";
const STALE_MS = 12 * 3600 * 1000;

// Prices in copper. AH defaults are the 22 Nov morning snapshot (21 Nov where 22 Nov had none).
// craft.from lists reagents per craft; "makes" is how many items one craft gives.
const ITEMS = {
  mageweave:       { name: "Mageweave Cloth", group: "Cloth", ah: 400 },
  bolt_mageweave:  { name: "Bolt of Mageweave", group: "Cloth", ah: 2142, sub: true,
                     craft: { by: "Tailoring", makes: 1, from: { mageweave: 5 } } },
  runecloth:       { name: "Runecloth", group: "Cloth", ah: 629 },
  bolt_runecloth:  { name: "Bolt of Runecloth", group: "Cloth", ah: 3047, sub: true,
                     craft: { by: "Tailoring", makes: 1, from: { runecloth: 5 } } },
  felcloth:        { name: "Felcloth", group: "Cloth", ah: 6400 },
  rugged_leather:  { name: "Rugged Leather", group: "Leather and herbs", ah: 2070 },
  frilled_lichen:  { name: "Frilled Lichen", group: "Leather and herbs", ah: 2700 },
  rosecap:         { name: "Rosecap", group: "Leather and herbs", ah: 1297 },
  stranglevine:    { name: "Stranglevine", group: "Leather and herbs", ah: 2569 },
  cerulean_dye:    { name: "Cerulean Dye", group: "Dyes", ah: 5887, sub: true,
                     craft: { by: "Alchemy alt", makes: 1, from: { frilled_lichen: 2, empty_vial: 1 } },
                     note: "1 dye per craft, confirmed in game (Wowhead says 2)." },
  magenta_dye:     { name: "Magenta Dye", group: "Dyes", ah: 2690, sub: true,
                     craft: { by: "Alchemy alt", makes: 1, from: { rosecap: 2, leaded_vial: 1 } },
                     note: "Dyes per craft not confirmed yet: change it here once you've seen it in game." },
  viridian_dye:    { name: "Viridian Dye", group: "Dyes", ah: 5700, sub: true,
                     craft: { by: "Alchemy alt", makes: 1, from: { stranglevine: 2, crystal_vial: 1 } },
                     note: "Dyes per craft not confirmed yet: change it here once you've seen it in game." },
  rune_thread:     { name: "Rune Thread", group: "Vendor", vendor: 4500 },
  heavy_silken_thread: { name: "Heavy Silken Thread", group: "Vendor", vendor: 1800 },
  red_dye:         { name: "Red Dye", group: "Vendor", vendor: 50 },
  empty_vial:      { name: "Empty Vial", group: "Vendor", vendor: 4 },
  leaded_vial:     { name: "Leaded Vial", group: "Vendor", vendor: null },
  crystal_vial:    { name: "Crystal Vial", group: "Vendor", vendor: null },
  runecloth_bag:   { name: "Runecloth Bag", group: "Products", ah: 48000,
                     craft: { by: "Tailoring 215", makes: 1, from: { bolt_runecloth: 5, rugged_leather: 2, rune_thread: 1, magenta_dye: 4, cerulean_dye: 2 } },
                     note: "14-slot bag." },
  runecloth_reagent_bag: { name: "Runecloth Reagent Bag", group: "Products", ah: 34596,
                     craft: { by: "Tailoring 215", makes: 1, from: { bolt_runecloth: 5, rugged_leather: 2, rune_thread: 1, viridian_dye: 1 } },
                     note: "14-slot reagent bag, BoE. Price from 21 Nov." },
  mageweave_reagent_bag: { name: "Mageweave Reagent Bag", group: "Products", ah: 24500,
                     craft: { by: "Tailoring 190", makes: 1, from: { bolt_mageweave: 4, heavy_silken_thread: 2, magenta_dye: 1, cerulean_dye: 1 } },
                     note: "12-slot reagent bag, BoE. Reagent amounts were worked out from a batch of 5: check them in game. Price from 21 Nov." },
  red_mageweave_bag: { name: "Red Mageweave Bag", group: "Products", ah: 15250,
                     craft: { by: "Tailoring ~200", makes: 1, from: { bolt_mageweave: 5, heavy_silken_thread: 2, red_dye: 2 } } },
  mooncloth:       { name: "Mooncloth", group: "Products", ah: 526887,
                     craft: { by: "Tailoring 230", makes: 1, from: { felcloth: 2 } },
                     note: "Needs a moonwell and has a 3.96-day cooldown, so this is the profit per cooldown. Price from 21 Nov." },
};
const RECIPES = ["runecloth_bag", "runecloth_reagent_bag", "mageweave_reagent_bag", "red_mageweave_bag", "mooncloth",
  "cerulean_dye", "magenta_dye", "viridian_dye"];
const GROUPS = ["Cloth", "Leather and herbs", "Dyes", "Vendor", "Products"];

// ---------- gold ----------
const fmt = (c) => {
  if (c == null || !isFinite(c)) return "–";
  const neg = c < 0; c = Math.round(Math.abs(c));
  const g = Math.floor(c / 10000), s = Math.floor(c / 100) % 100, k = c % 100, out = [];
  if (g) out.push(`${g.toLocaleString("en")}g`);
  if (s || (g && k)) out.push(`${s}s`);
  if (k || (!g && !s)) out.push(`${k}c`);
  return (neg ? "−" : "") + out.join(" ");
};
// "3g 22s 50c", "3g22s", "45s", "50c"; a bare number is silver. "" is null, anything else NaN.
const parseGold = (str) => {
  str = String(str ?? "").trim().toLowerCase().replace(/,/g, ".");
  if (!str) return null;
  const re = /(\d+(?:\.\d+)?)\s*([gsc])/g;
  if (/[gsc]/.test(str)) {
    if (str.replace(re, "").trim()) return NaN;
    let total = 0, m;
    while ((m = re.exec(str))) total += parseFloat(m[1]) * { g: 10000, s: 100, c: 1 }[m[2]];
    return Math.round(total);
  }
  return /^\d+(\.\d+)?$/.test(str) ? Math.round(parseFloat(str) * 100) : NaN;
};
const net = (price) => Math.floor(price * CUT);
const breakEven = (cost) => Math.ceil(cost / CUT);
const gcell = (c, cls = "") => `<span class="g ${cls}">${fmt(c)}</span>`;
const signed = (c) => gcell(c, c > 0 ? "pos" : c < 0 ? "neg" : "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toLocaleDateString("en-CA");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---------- state ----------
const fresh = () => ({ prices: {}, vendor: {}, mode: {}, qty: {}, makes: {}, ladder: {}, batches: [], sales: [] });
let S = load();
function load() {
  try { return Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { return fresh(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

const ahPrice = (id) => id in S.prices ? S.prices[id].ah : (ITEMS[id].ah ?? null);
const ahAt = (id) => id in S.prices ? S.prices[id].at : (ITEMS[id].ah != null ? DEFAULT_AT : null);
const vendorPrice = (id) => id in S.vendor ? S.vendor[id] : (ITEMS[id].vendor ?? null);
const qtyOf = (rid, id) => S.qty[rid]?.[id] ?? ITEMS[rid].craft.from[id];
const makesOf = (id) => S.makes[id] ?? ITEMS[id].craft.makes;
const modeOf = (id) => S.mode[id] || "auto";

// ---------- cost engine ----------
// Ways to get one of an item: from the AH, a vendor, or crafting it (only for sub-crafts: bolts and dyes)
function sources(id) {
  const out = [], ah = ahPrice(id), v = vendorPrice(id);
  if (ah != null) out.push({ src: "AH", cost: ah, missing: [] });
  if (v != null) out.push({ src: "Vendor", cost: v, missing: [] });
  if (ITEMS[id].sub) { const r = recipeCost(id); out.push({ src: "Craft", cost: r.each, missing: r.missing }); }
  return out;
}
function unitCost(id) {
  const opts = sources(id), mode = modeOf(id);
  let pool = mode === "buy" ? opts.filter((o) => o.src !== "Craft") : mode === "craft" ? opts.filter((o) => o.src === "Craft") : opts;
  if (!pool.length) pool = opts;
  if (!pool.length) return { cost: 0, src: "none", opts, missing: [id] };
  const best = pool.reduce((a, b) => (b.cost < a.cost ? b : a));
  return { cost: best.cost, src: best.src, opts, missing: best.missing };
}
function recipeCost(id) {
  let total = 0; const lines = [], missing = new Set();
  for (const rid of Object.keys(ITEMS[id].craft.from)) {
    const q = qtyOf(id, rid), u = unitCost(rid);
    total += q * u.cost; u.missing.forEach((m) => missing.add(m));
    lines.push({ id: rid, q, u });
  }
  const makes = makesOf(id);
  return { total, makes, each: total / makes, lines, missing: [...missing] };
}
function summary(id) {
  const r = recipeCost(id), sell = ahPrice(id);
  const profit = sell != null ? net(sell) - r.each : null;
  return { r, sell, be: breakEven(r.each), profit };
}

// ---------- rendering ----------
let tab = "calc", open = null;
const view = document.getElementById("view");
const tabs = document.getElementById("tabs");
tabs.addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) { tab = b.dataset.tab; render(); } });

function render() {
  for (const b of tabs.children) b.setAttribute("aria-selected", b.dataset.tab === tab);
  const stale = Object.keys(ITEMS).filter((id) => ahAt(id) && Date.now() - new Date(ahAt(id)) > STALE_MS);
  const el = document.getElementById("stale");
  el.hidden = !stale.length;
  el.textContent = stale.length ? `${stale.length} AH price${stale.length > 1 ? "s are" : " is"} more than 12 hours old. Update them on the Prices tab before trusting the profit.` : "";
  view.innerHTML = tab === "calc" ? calcView() : tab === "prices" ? pricesView() : batchesView();
  if (tab === "batches") updateBatchCost();
}

function missingNote(missing) {
  return missing.length ? `<div class="warn">No price for ${missing.map((m) => esc(ITEMS[m].name)).join(", ")}: counted as 0.</div>` : "";
}

function calcView() {
  const rows = RECIPES.map((id) => {
    const s = summary(id), isOpen = open === id;
    const margin = s.profit != null && s.sell ? ` <span class="small">${(s.profit / s.sell * 100).toFixed(0)}%</span>` : "";
    return `<tr class="open" tabindex="0" data-open="${id}" aria-expanded="${isOpen}">
      <td><span class="chev">›</span> ${esc(ITEMS[id].name)}${s.r.missing.length ? ' <span class="warn">⚠</span>' : ""}</td>
      <td class="num">${gcell(s.r.each)}</td><td class="num">${gcell(s.be, "gold")}</td>
      <td class="num">${gcell(s.sell)}</td><td class="num">${s.profit == null ? "–" : signed(s.profit)}${margin}</td></tr>
      ${isOpen ? `<tr class="detail"><td colspan="5">${detail(id, s)}</td></tr>` : ""}`;
  }).join("");
  return `<div class="card"><table>
    <thead><tr><th>Craft</th><th class="num">Cost per item</th><th class="num">Break-even listing</th>
      <th class="num">AH price</th><th class="num">Profit each</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="note">Profit = AH price × 0.95 − material cost. Break-even = cost ÷ 0.95. Bolts and dyes use whichever is
      cheaper, buying or crafting, unless you choose otherwise in a craft's breakdown (open a row). Deposits aren't counted:
      they only matter when an auction expires.</p>`;
}

function srcPill(src) {
  return src === "none" ? '<span class="pill">no price</span>' : `<span class="pill ${src.toLowerCase()}">${src}</span>`;
}

function detail(id, s) {
  const it = ITEMS[id], r = s.r;
  const lines = r.lines.map((l) => {
    const sub = ITEMS[l.id].sub;
    const alts = l.u.opts.map((o) => `${o.src.toLowerCase()} ${fmt(o.cost)}`).join(" · ");
    const choose = sub ? `<select data-mode="${l.id}" aria-label="How to get ${esc(ITEMS[l.id].name)}">
        ${[["auto", "Cheapest"], ["buy", "Buy"], ["craft", "Craft"]].map(([v, t]) =>
          `<option value="${v}"${modeOf(l.id) === v ? " selected" : ""}>${t}</option>`).join("")}</select>` : "";
    return `<tr><td>${esc(ITEMS[l.id].name)}</td>
      <td class="num"><input class="qin" type="number" min="0" step="1" value="${l.q}" data-qty="${id}:${l.id}" aria-label="Amount of ${esc(ITEMS[l.id].name)}"></td>
      <td class="num">${gcell(l.u.cost)}</td><td>${srcPill(l.u.src)} ${choose}<div class="small">${alts || "no price set"}</div></td>
      <td class="num">${gcell(l.q * l.u.cost)}</td></tr>`;
  }).join("");
  const makes = `<label class="field">Items per craft <input class="qin" type="number" min="1" step="1" value="${r.makes}" data-makes="${id}"></label>`;
  return `<div class="small">${esc(it.craft.by)}${it.note ? ` · ${esc(it.note)}` : ""}</div>
    <div class="inner"><table>
      <thead><tr><th>Reagent</th><th class="num">Amount</th><th class="num">Each</th><th>Source</th><th class="num">Total</th></tr></thead>
      <tbody>${lines}
      <tr class="last"><td colspan="4"><b>Cost per craft</b>${r.makes > 1 ? ` <span class="small">(${r.makes} items, ${fmt(r.each)} each)</span>` : ""}</td>
        <td class="num"><b>${gcell(r.total)}</b></td></tr></tbody></table></div>
    ${missingNote(r.missing)}
    <div class="row" style="margin-top:12px">${makes}
      <label class="field">AH price <input class="gin" type="text" value="${s.sell == null ? "" : fmt(s.sell)}" data-ah="${id}"></label>
      <button class="btn" data-startbatch="${id}">Start a batch of this</button></div>
    <h2>Profit at each listing price</h2>${ladder(id, s)}`;
}

function ladderRange(id, s) {
  const saved = S.ladder[id];
  if (saved) return saved;
  const step = s.sell != null && s.sell >= 100000 ? 10000 : 500;
  const centre = s.sell ?? s.be;
  const from = Math.max(step, Math.floor(centre / step) * step - 5 * step);
  return { from, to: from + 10 * step, step };
}
function ladder(id, s) {
  const { from, to, step } = ladderRange(id, s);
  const rows = [];
  let beMarked = false;
  for (let p = from, n = 0; p <= to && n < 60; p += step, n++) {
    const profit = net(p) - s.r.each, cls = [];
    if (!beMarked && p >= s.be) { cls.push("be"); beMarked = true; }
    rows.push(`<tr class="${cls.join(" ")}"><td class="num">${gcell(p)}${p === s.sell ? ' <span class="pill ah">AH now</span>' : ""}</td>
      <td class="num">${gcell(net(p))}</td><td class="num">${signed(profit)}</td>
      <td class="num">${p ? (profit / p * 100).toFixed(1) + "%" : "–"}</td></tr>`);
  }
  return `<div class="row">
      <label class="field">From <input class="gin" type="text" value="${fmt(from)}" data-ladder="${id}:from"></label>
      <label class="field">To <input class="gin" type="text" value="${fmt(to)}" data-ladder="${id}:to"></label>
      <label class="field">Step <input class="gin" type="text" value="${fmt(step)}" data-ladder="${id}:step"></label>
      <span class="small">Break-even ${fmt(s.be)} (gold line)</span></div>
    <div class="inner"><table><thead><tr><th class="num">Listing price</th><th class="num">You get (after 5%)</th>
      <th class="num">Profit each</th><th class="num">Margin</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}

function age(at) {
  if (!at) return "";
  const ms = Date.now() - new Date(at), h = ms / 3600000;
  const txt = h < 1 ? `${Math.max(1, Math.round(ms / 60000))} min ago` : h < 48 ? `${Math.round(h)} h ago`
    : new Date(at).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  return `<span class="${ms > STALE_MS ? "warn" : "small"}">${txt}</span>`;
}

function pricesView() {
  const body = GROUPS.map((g) => {
    const ids = Object.keys(ITEMS).filter((id) => ITEMS[id].group === g);
    return `<tr class="sec"><td colspan="3">${g === "Products" ? "Products (what you sell them for)" : g}</td></tr>` + ids.map((id) => {
      const isVendor = g === "Vendor";
      const val = isVendor ? vendorPrice(id) : ahPrice(id);
      return `<tr><td>${esc(ITEMS[id].name)}</td>
        <td class="num"><input class="gin" type="text" value="${val == null ? "" : fmt(val)}" placeholder="${isVendor ? "not set" : "none"}"
          ${isVendor ? `data-vendor="${id}"` : `data-ah="${id}"`} aria-label="${esc(ITEMS[id].name)} ${isVendor ? "vendor" : "AH"} price"></td>
        <td>${isVendor ? '<span class="small">vendor</span>' : age(ahAt(id))}</td></tr>`;
    }).join("");
  }).join("");
  return `<div class="card"><table><thead><tr><th>Item</th><th class="num">Price each</th><th>Updated</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <p class="note">Type prices the way the game shows them: <span class="g">3g 22s 50c</span>, <span class="g">45s</span>,
      <span class="g">50c</span>. A plain number is silver. Leave a field empty if you can't buy the item. The AH prices
      start as the 22 Nov snapshot.</p>
    <div class="toolbar">
      <button class="btn" data-act="export">Download a backup</button>
      <button class="btn" data-act="import">Restore a backup…</button>
      <button class="btn" data-act="reset">Reset prices to the 22 Nov snapshot</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>`;
}

// ---------- batches ----------
function allocate() {
  const order = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.created - b.created);
  const batches = [...S.batches].sort(order).map((b) => ({ ...b, sold: 0, got: 0 }));
  const unmatched = [];
  for (const s of [...S.sales].sort(order)) {
    let left = s.qty;
    for (const b of batches) {
      if (!left) break;
      if (b.recipe !== s.recipe || b.sold >= b.qty) continue;
      const take = Math.min(left, b.qty - b.sold);
      b.sold += take; b.got += take * net(s.price); left -= take;
    }
    if (left) unmatched.push({ ...s, left });
  }
  return { batches, unmatched };
}

let form = { recipe: RECIPES[0], prices: null };
function batchPrices(recipe) {
  return Object.fromEntries(Object.keys(ITEMS[recipe].craft.from).map((rid) => [rid, Math.round(unitCost(rid).cost)]));
}
function batchesView() {
  if (!form.prices || form.pricesFor !== form.recipe) { form.prices = batchPrices(form.recipe); form.pricesFor = form.recipe; }
  const opt = (sel) => RECIPES.map((id) => `<option value="${id}"${id === sel ? " selected" : ""}>${esc(ITEMS[id].name)}</option>`).join("");
  const mats = Object.keys(ITEMS[form.recipe].craft.from).map((rid) => `<tr><td>${esc(ITEMS[rid].name)}</td>
      <td class="num">× ${qtyOf(form.recipe, rid)}</td>
      <td class="num"><input class="gin" type="text" value="${fmt(form.prices[rid])}" data-bprice="${rid}" aria-label="Price paid for ${esc(ITEMS[rid].name)}"></td></tr>`).join("");
  const { batches, unmatched } = allocate();
  const brows = batches.map((b) => {
    const left = b.qty - b.sold, profit = b.got - b.sold * b.costEach, sell = ahPrice(b.recipe);
    const ifRest = sell != null ? b.got + left * net(sell) - b.qty * b.costEach : null;
    return `<tr><td>${esc(b.date)}</td><td>${esc(ITEMS[b.recipe].name)}${b.note ? `<div class="small">${esc(b.note)}</div>` : ""}</td>
      <td class="num">${b.qty}</td><td class="num">${b.sold}</td><td class="num">${left || '<span class="pos">sold out</span>'}</td>
      <td class="num">${gcell(b.costEach)}</td><td class="num">${gcell(breakEven(b.costEach), "gold")}</td>
      <td class="num">${gcell(b.got)}</td><td class="num">${b.sold ? signed(profit) : "–"}</td>
      <td class="num">${left && ifRest != null ? signed(ifRest) : b.sold ? signed(profit) : "–"}</td>
      <td><button class="link" data-delbatch="${b.id}" aria-label="Delete batch">✕</button></td></tr>`;
  }).join("");
  const srows = [...S.sales].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.created - a.created)).map((s) => {
    const um = unmatched.find((u) => u.id === s.id);
    return `<tr><td>${esc(s.date)}</td><td>${esc(ITEMS[s.recipe].name)}${um ? ` <span class="warn">${um.left} not in any batch</span>` : ""}</td>
      <td class="num">${s.qty}</td><td class="num">${gcell(s.price)}</td><td class="num">${gcell(s.qty * net(s.price))}</td>
      <td><button class="link" data-delsale="${s.id}" aria-label="Delete sale">✕</button></td></tr>`;
  }).join("");
  return `<div class="grid2">
    <div class="card pad"><h2 style="margin-top:0">New batch</h2>
      <div class="row">
        <label class="field">Craft <select id="bRecipe">${opt(form.recipe)}</select></label>
        <label class="field">Date <input type="date" id="bDate" value="${today()}"></label>
        <label class="field">How many <input class="qin" type="number" id="bQty" min="1" step="1" value="10"></label>
      </div>
      <div class="inner"><table><thead><tr><th>Price paid per reagent</th><th class="num">Per craft</th><th class="num">Each</th></tr></thead>
        <tbody>${mats}</tbody></table></div>
      <p class="small" style="margin:6px 2px">Filled in from today's prices (bought or crafted, whichever the calculator picks). Change them to what you really paid.</p>
      <div class="row"><label class="field" style="flex:1">Note <input type="text" id="bNote" placeholder="optional"></label></div>
      <p id="bCost" style="margin:10px 2px"></p>
      <button class="btn primary" data-act="addbatch">Save batch</button>
    </div>
    <div class="card pad"><h2 style="margin-top:0">Log a sale</h2>
      <div class="row">
        <label class="field">Craft <select id="sRecipe">${opt(form.saleRecipe || form.recipe)}</select></label>
        <label class="field">Date <input type="date" id="sDate" value="${today()}"></label>
        <label class="field">How many <input class="qin" type="number" id="sQty" min="1" step="1" value="1"></label>
        <label class="field">Sold for, each <input class="gin" type="text" id="sPrice" placeholder="2g 35s"></label>
      </div>
      <p class="small" style="margin:10px 2px">The sold price before the 5% cut. Sales come out of the oldest batch of that craft first.</p>
      <button class="btn primary" data-act="addsale">Save sale</button>
    </div></div>
    <h2>Batches</h2>
    <div class="card">${batches.length ? `<table><thead><tr><th>Date</th><th>Craft</th><th class="num">Made</th><th class="num">Sold</th>
      <th class="num">Left</th><th class="num">Cost each</th><th class="num">Break-even</th><th class="num">Received</th>
      <th class="num">Profit so far</th><th class="num">If the rest sells at AH price</th><th></th></tr></thead><tbody>${brows}</tbody></table>`
      : '<div class="empty">No batches yet. Save one above when you buy materials.</div>'}</div>
    <h2>Sales</h2>
    <div class="card">${S.sales.length ? `<table><thead><tr><th>Date</th><th>Craft</th><th class="num">How many</th>
      <th class="num">Price each</th><th class="num">Received (after 5%)</th><th></th></tr></thead><tbody>${srows}</tbody></table>`
      : '<div class="empty">No sales logged yet.</div>'}</div>`;
}
function batchCostEach() {
  const total = Object.entries(form.prices).reduce((t, [rid, p]) => t + qtyOf(form.recipe, rid) * (p || 0), 0);
  return total / makesOf(form.recipe);
}
function updateBatchCost() {
  const el = document.getElementById("bCost"); if (!el) return;
  const each = batchCostEach(), qty = +document.getElementById("bQty").value || 0;
  el.innerHTML = `Cost each ${gcell(each)} · break-even ${gcell(breakEven(each), "gold")} · whole batch ${gcell(each * qty)}`;
}

// ---------- input handling ----------
function setGold(input, apply) {
  const v = parseGold(input.value);
  if (Number.isNaN(v)) { input.classList.add("bad"); input.title = "Use 3g 22s 50c, 45s or 50c"; return false; }
  input.classList.remove("bad"); apply(v); return true;
}
view.addEventListener("change", (e) => {
  const t = e.target, d = t.dataset;
  if (d.ah) { if (setGold(t, (v) => { S.prices[d.ah] = { ah: v, at: new Date().toISOString() }; })) { save(); render(); } }
  else if (d.vendor) { if (setGold(t, (v) => { S.vendor[d.vendor] = v; })) { save(); render(); } }
  else if (d.mode) { S.mode[d.mode] = t.value; save(); render(); }
  else if (d.qty) { const [r, i] = d.qty.split(":"); const v = Math.max(0, +t.value || 0);
    (S.qty[r] ||= {})[i] = v; save(); form.prices = null; render(); }
  else if (d.makes) { S.makes[d.makes] = Math.max(1, Math.round(+t.value || 1)); save(); render(); }
  else if (d.ladder) {
    const [id, k] = d.ladder.split(":");
    if (setGold(t, (v) => { const rng = { ...ladderRange(id, summary(id)) }; if (v) rng[k] = v; S.ladder[id] = rng; })) { save(); render(); }
  }
  else if (d.bprice) { if (setGold(t, (v) => { form.prices[d.bprice] = v ?? 0; })) { t.value = fmt(form.prices[d.bprice]); updateBatchCost(); } }
  else if (t.id === "bRecipe") { form.recipe = t.value; render(); }
  else if (t.id === "sRecipe") { form.saleRecipe = t.value; }
  else if (t.id === "bQty") updateBatchCost();
  else if (t.id === "importFile" && t.files[0]) importBackup(t.files[0]);
});
view.addEventListener("input", (e) => { if (e.target.id === "bQty") updateBatchCost(); });
view.addEventListener("keydown", (e) => {
  const row = e.target.closest?.("tr.open");
  if (row && e.target === row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(row.dataset.open); }
});
view.addEventListener("click", (e) => {
  const t = e.target;
  const row = t.closest("tr.open");
  if (row && !t.closest("input,select,button")) return toggle(row.dataset.open);
  const b = t.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.startbatch) { form.recipe = d.startbatch; form.prices = null; tab = "batches"; render(); }
  else if (d.delbatch && confirm("Delete this batch? Its sales stay and move to the next batch.")) {
    S.batches = S.batches.filter((x) => x.id !== d.delbatch); save(); render(); }
  else if (d.delsale && confirm("Delete this sale?")) { S.sales = S.sales.filter((x) => x.id !== d.delsale); save(); render(); }
  else if (d.act === "addbatch") {
    const qty = Math.round(+document.getElementById("bQty").value);
    if (!(qty > 0)) return alert("Enter how many you're making.");
    S.batches.push({ id: uid(), created: Date.now(), recipe: form.recipe, date: document.getElementById("bDate").value || today(),
      qty, prices: { ...form.prices }, costEach: batchCostEach(), note: document.getElementById("bNote").value.trim() });
    save(); render();
  } else if (d.act === "addsale") {
    const qty = Math.round(+document.getElementById("sQty").value), price = parseGold(document.getElementById("sPrice").value);
    if (!(qty > 0)) return alert("Enter how many you sold.");
    if (!(price > 0)) return alert("Enter the price each, e.g. 2g 35s.");
    const recipe = document.getElementById("sRecipe").value;
    form.saleRecipe = recipe;
    S.sales.push({ id: uid(), created: Date.now(), recipe, date: document.getElementById("sDate").value || today(), qty, price });
    save(); render();
  } else if (d.act === "export") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }));
    a.download = `forever-craft-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
  } else if (d.act === "import") document.getElementById("importFile").click();
  else if (d.act === "reset" && confirm("Reset every AH and vendor price to the 22 Nov snapshot? Batches and sales are kept.")) {
    S.prices = {}; S.vendor = {}; save(); render();
  }
});
function toggle(id) { open = open === id ? null : id; render(); }
function importBackup(file) {
  file.text().then((txt) => {
    const data = JSON.parse(txt);
    if (typeof data !== "object" || !Array.isArray(data.batches)) throw new Error("not a backup");
    if (!confirm(`Replace everything here with this backup (${data.batches.length} batches, ${(data.sales || []).length} sales)?`)) return;
    S = Object.assign(fresh(), data); save(); render();
  }).catch(() => alert("That file isn't a backup from this page."));
}
window.addEventListener("storage", (e) => { if (e.key === KEY) { S = load(); render(); } });
render();
</script>
</body>
